name: GitGuardian scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@5cc1ed2be3e8bf625d354c7170731880670f74de  # v1.56.1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_TOKEN }}