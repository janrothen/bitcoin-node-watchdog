[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heartbeat-sender"
version = "0.1.0"
description = "Heartbeat sender for a Bitcoin full node on Raspberry Pi. Reports liveness to AWS every hour via HMAC-signed HTTP POST."
requires-python = ">=3.13"
dependencies = [
    "requests~=2.34",
    "python-dotenv>=1.2.4,<2",
    # Transitive via requests; floors exclude advisories on the TLS path:
    # certifi GHSA-6q48-6c7w-9gw2 (compromised emSign intermediates),
    # urllib3 GHSA-qccp-gfcp-xxvc / GHSA-gh4c-6fx4-qh6g / GHSA-8988-9cw3-xx77.
    "certifi>=2026.10.23",
    "urllib3>=2.8,<3",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2",
    "pytest-cov~=7.1",
    "pre-commit~=4.7",
    "aws-cdk-lib~=2.277",
    "constructs~=10.8",
    "boto3~=1.44",
    "ruff>=0.17.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heartbeat_sender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=xml --cov-config=pyproject.toml"

[tool.coverage.run]
relative_files = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "aws/app.py",
    "scripts/*",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-length enforced by formatter, not linter
]
