[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heartbeat-sender"
version = "0.1.0"
description = "Heartbeat sender for a Bitcoin full node on Raspberry Pi. Reports liveness to AWS every hour via HMAC-signed HTTP POST."
requires-python = ">=3.13"
dependencies = [
    "requests~=2.33",
    "python-dotenv~=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0",
    "pytest-cov~=7.1",
    "pre-commit~=4.5",
    "aws-cdk-lib~=2.248",
    "constructs~=10.6",
    "boto3~=1.42",
    "ruff>=0.15.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/heartbeat_sender"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=xml --cov-config=pyproject.toml"

[tool.coverage.run]
relative_files = true
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "aws/app.py",
    "scripts/*",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line-length enforced by formatter, not linter
]
